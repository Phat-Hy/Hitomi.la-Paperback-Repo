name: Bundle and Publish Sources
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Checkout existing bundles
        uses: actions/checkout@v4.1.2
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - name: Install dependencies
        run: npm install

      - name: Bundle extensions
        shell: bash
        run: |
          mkdir -p bundles
          TARGET_FOLDER="${{ steps.extract_branch.outputs.branch }}"
          if [ "$TARGET_FOLDER" = "main" ] || [ "$TARGET_FOLDER" = "master" ]; then
            TARGET_FOLDER="0.8"
          fi
          npx paperback bundle
          npx paperback bundle --folder="$TARGET_FOLDER"
          touch bundles/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          branch: gh-pages
          folder: bundles
          token: ${{ secrets.GITHUB_TOKEN }}
