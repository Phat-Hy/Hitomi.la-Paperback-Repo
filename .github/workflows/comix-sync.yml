name: Sync Comix Signing Key
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a scrape even if the key still verifies (only writes when the key changed)'
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Optional reverse proxy for comix.to (Cloudflare Worker, Vercel function, ...).
  # Templates: https://my-worker.dev/?url={url_encoded}  or  https://my-worker.dev/{url}
  # Set as a repository variable, never hard-code it here.
  COMIX_PROXY_URL: ${{ vars.COMIX_PROXY_URL }}
  # Optional provider override for debugging, e.g. "translate,wayback".
  COMIX_PROVIDERS: ${{ vars.COMIX_PROVIDERS }}

jobs:
  sync-key:
    name: Check & Rotate Comix Signing Key
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4.1.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 20.x

      - name: Check and extract active key
        id: sync
        env:
          COMIX_FORCE_ROTATE: ${{ inputs.force }}
        run: node scripts/sync-comix-key.js

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4.3.3
        with:
          name: comix-sync-report
          path: comix-sync-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push updated key
        run: |
          if [ -n "$(git status --porcelain comix_keys.json)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add comix_keys.json
            git commit -m "chore(comix): auto-rotate signing key from comix.to [skip ci]"
            git push origin main

            git checkout 0.8 || git checkout -b 0.8 origin/0.8
            git pull origin 0.8 --no-edit || true
            git merge main --no-edit -m "chore(comix): sync 0.8 with main [skip ci]" || (git checkout --theirs . && git commit --no-edit -m "chore(comix): sync 0.8 with main [skip ci]")
            git push origin 0.8 || echo "Warning: failed to push to 0.8, proceeding with deployment"
            git checkout main
          else
            echo "Signing key is unchanged and operational."
          fi

      - name: Install dependencies
        if: steps.sync.outputs.key_updated == 'true'
        run: npm install

      - name: Bundle extensions
        if: steps.sync.outputs.key_updated == 'true'
        run: |
          npx paperback bundle
          npx paperback bundle --folder=0.8
          cp comix_keys.json bundles/comix_keys.json || true
          touch bundles/.nojekyll

      - name: Deploy updated key to GitHub Pages
        if: steps.sync.outputs.key_updated == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          branch: gh-pages
          folder: bundles
          single-commit: true
          token: ${{ secrets.GITHUB_TOKEN }}
